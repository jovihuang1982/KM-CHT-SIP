<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>報修系統管理後台 - Dashboard</title>
<!-- Bootstrap 5 CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
<!-- FontAwesome 圖示 -->
<link
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
	rel="stylesheet">
<!-- Chart.js 圖表庫 -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="style-das.css">
</head>
<body>

	<!-- 1. 登入視圖 (Login View) -->
	<div id="loginView" class="page-view active">
		<div class="login-card text-center">
			<h3 class="mb-4"
				style="color: var(- -primary-navy); font-weight: 600;">報修管理系統</h3>
			<form id="loginForm">
				<div class="form-floating mb-3 text-start">
					<input type="text" class="form-control" id="username"
						placeholder="帳號" value="admin" required> <label
						for="username">管理員帳號</label>
				</div>
				<div class="form-floating mb-4 text-start">
					<input type="password" class="form-control" id="password"
						placeholder="密碼" value="1234" required> <label
						for="password">密碼</label>
				</div>
				<button type="submit" class="btn btn-navy w-100 py-2">登入系統</button>
			</form>
		</div>
	</div>

	<!-- 2. 主後台內容 (Main Dashboard View) -->
	<div id="dashboardView" class="page-view">
		<!-- 頂部導覽列 -->
		<nav
			class="navbar navbar-expand-lg navbar-custom navbar-dark sticky-top">
			<div class="container-fluid px-3 px-md-4">
				<a class="navbar-brand" href="#"><i
					class="fa-solid fa-screwdriver-wrench me-2"></i>維運管理 Dashboard</a>
				<button class="navbar-toggler border-0" type="button"
					data-bs-toggle="collapse" data-bs-target="#navbarNav">
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse mt-2 mt-lg-0" id="navbarNav">
					<ul class="navbar-nav me-auto mb-2 mb-lg-0">
						<li class="nav-item"><a class="nav-link active"
							id="tabAnalytics" href="#" onclick="switchTab('analytics')">
								<i class="fa-solid fa-chart-pie me-1"></i>數據分析
						</a></li>
						<li class="nav-item"><a class="nav-link" id="tabCases"
							href="#" onclick="switchTab('cases')"> <i
								class="fa-solid fa-list-check me-1"></i>案件管理
						</a></li>
					</ul>
					<div
						class="d-flex align-items-center justify-content-between justify-content-lg-end text-white pt-2 pt-lg-0 border-top border-secondary border-lg-0">
						<span class="me-3 small"><i
							class="fa-solid fa-user-gear me-1"></i> 管理員</span>
						<button class="btn btn-sm btn-outline-light" onclick="logout()">
							<i class="fa-solid fa-right-from-bracket me-1"></i>登出
						</button>
					</div>
				</div>
			</div>
		</nav>

		<div class="container-fluid p-3 p-md-4">

			<!-- A. 數據分析分頁 -->
			<div id="analyticsContent">
				<div class="row g-3 mb-4">
					<div class="col-12 col-sm-6 col-xl-3">
						<div class="stat-card gold-border">
							<div class="stat-title">待處理案件 (Backlog)</div>
							<div class="stat-value text-danger" id="kpiOpenCases">3</div>
						</div>
					</div>
					<div class="col-12 col-sm-6 col-xl-3">
						<div class="stat-card">
							<div class="stat-title">本月報修總數</div>
							<div class="stat-value" id="kpiTotalCases">28</div>
						</div>
					</div>
					<div class="col-12 col-sm-6 col-xl-3">
						<div class="stat-card">
							<div class="stat-title">平均結案率</div>
							<div class="stat-value text-success">89.2%</div>
						</div>
					</div>
					<div class="col-12 col-sm-6 col-xl-3">
						<div class="stat-card gold-border">
							<div class="stat-title">主要障礙分類</div>
							<div class="stat-value" style="font-size: 1.3rem;">線路問題</div>
						</div>
					</div>
				</div>

				<div class="row g-3">
					<div class="col-12 col-lg-6">
						<div class="card p-3 shadow-sm border-0 h-100">
							<h6 class="card-title text-muted mb-3">
								<i class="fa-solid fa-chart-pie me-1"></i> 障礙真因分類統計
								(IssueCategory)
							</h6>
							<div class="chart-container">
								<canvas id="categoryChart"></canvas>
							</div>
						</div>
					</div>
					<div class="col-12 col-lg-6">
						<div class="card p-3 shadow-sm border-0 h-100">
							<h6 class="card-title text-muted mb-3">
								<i class="fa-solid fa-chart-line me-1"></i> 報修種類量分析 (IssueType)
							</h6>
							<div class="chart-container">
								<canvas id="typeChart"></canvas>
							</div>
						</div>
					</div>
				</div>
			</div>

			<!-- B. 案件管理分頁 -->
			<div id="casesContent" style="display: none;">
				<div class="card p-3 shadow-sm border-0">
					<div class="row g-2 mb-3">
						<div class="col-12 col-md-4 col-lg-3">
							<input type="text" id="searchInput"
								class="form-control form-control-sm"
								placeholder="搜尋 IssueId, 聯絡人, 單位..." onkeyup="filterCases()">
						</div>
						<div class="col-6 col-md-4 col-lg-2">
							<select id="statusFilter" class="form-select form-select-sm"
								onchange="filterCases()">
								<option value="">所有狀態</option>
								<option value="Open">未結案 (Open)</option>
								<option value="Closed">已結案 (Closed)</option>
							</select>
						</div>
						<div class="col-6 col-md-4 col-lg-2">
							<select id="categoryFilter" class="form-select form-select-sm"
								onchange="filterCases()">
								<option value="">所有真因分類</option>
								<option value="線路問題">線路問題</option>
								<option value="硬體問題">硬體問題</option>
								<option value="軟體問題">軟體問題</option>
								<option value="未分類">未分類</option>
							</select>
						</div>
					</div>

					<div class="table-responsive">
						<table class="table table-hover align-middle">
							<thead class="table-light">
								<tr class="text-nowrap">
									<th>IssueId</th>
									<th>時間</th>
									<th>單位 / 聯絡人</th>
									<th>種類</th>
									<th>報修描述</th>
									<th>狀態</th>
									<th>真因分類</th>
									<th>處置措施</th>
									<th class="text-center">操作</th>
								</tr>
							</thead>
							<tbody id="caseTableBody">
							</tbody>
						</table>
					</div>
				</div>
			</div>

		</div>
	</div>

	<!-- 編輯案件 Modal 彈窗 -->
	<div class="modal fade" id="editModal" tabindex="-1">
		<div
			class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
			<div class="modal-content">
				<div class="modal-header"
					style="background-color: var(- -primary-navy); color: white;">
					<h5 class="modal-title fs-6">
						<i class="fa-solid fa-pen-to-square me-2"></i>更新案件結案資訊
					</h5>
					<button type="button" class="btn-close btn-close-white"
						data-bs-dismiss="modal"></button>
				</div>
				<div class="modal-body">
					<form id="editForm">
						<input type="hidden" id="modalIssueId">

						<div class="mb-3">
							<label class="form-label text-muted small">報修單號</label> <input
								type="text" class="form-control form-control-sm bg-light"
								id="displayIssueId" readonly>
						</div>

						<div class="mb-3">
							<label class="form-label text-muted small">報修描述 (Client
								填寫)</label>
							<textarea class="form-control form-control-sm bg-light"
								id="displayDescription" rows="2" readonly></textarea>
						</div>

						<hr class="my-2">

						<div class="mb-3">
							<label for="modalCaseClosed" class="form-label fw-bold small">結案狀態
								(CaseClosed)</label> <select class="form-select form-select-sm"
								id="modalCaseClosed">
								<option value="false">未結案 (Open)</option>
								<option value="true">已結案 (Closed)</option>
							</select>
						</div>

						<div class="mb-3">
							<label for="modalIssueCategory" class="form-label fw-bold small">障礙真因分類
								(IssueCategory)</label> <select class="form-select form-select-sm"
								id="modalIssueCategory">
								<option value="未分類">未分類</option>
								<option value="線路問題">線路問題</option>
								<option value="硬體問題">硬體問題</option>
								<option value="軟體問題">軟體問題</option>
								<option value="人為操作">人為操作</option>
							</select>
						</div>

						<div class="mb-3">
							<label for="modalActionTaken" class="form-label fw-bold small">處置措施簡述
								(ActionTaken)</label>
							<textarea class="form-control form-control-sm"
								id="modalActionTaken" rows="3" placeholder="請詳述處置方式..."></textarea>
						</div>
					</form>
				</div>
				<div class="modal-footer p-2">
					<button type="button" class="btn btn-sm btn-secondary"
						data-bs-dismiss="modal">取消</button>
					<button type="button" class="btn btn-sm btn-gold"
						onclick="saveCaseAdminData()">儲存更新</button>
				</div>
			</div>
		</div>
	</div>

	<!-- Bootstrap & JS 腳本 -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script>
        let casesData = [
            {
                IssueId: "REQ-20260928-01",
                LineId: "U123456",
                LineName: "張小明",
                Phone: "分機 2101",
                Department: "資訊處",
                Contact: "張先生",
                IssueType: "話機障礙",
                Description: "話機拿起無聲，無法撥接外部電話。",
                IssueTime: "2026-09-28 09:30",
                CaseClosed: false,
                ActionTaken: "",
                IssueCategory: "未分類"
            },
            {
                IssueId: "REQ-20260927-05",
                LineId: "U888999",
                LineName: "李總務",
                Phone: "分機 1105",
                Department: "總務處",
                Contact: "李小姐",
                IssueType: "更改共振群組",
                Description: "需新增新進人員分機 1108 到客服共振組。",
                IssueTime: "2026-09-27 14:15",
                CaseClosed: true,
                ActionTaken: "已於交換機後台加入共振設定並測試通話正常。",
                IssueCategory: "軟體問題"
            },
            {
                IssueId: "REQ-20260926-02",
                LineId: "U333222",
                LineName: "王業務",
                Phone: "0912-345678",
                Department: "業務部",
                Contact: "王專員",
                IssueType: "話機障礙",
                Description: "通話雜音極大，斷斷續續。",
                IssueTime: "2026-09-26 11:00",
                CaseClosed: true,
                ActionTaken: "檢查為 RJ11 水晶頭接觸不良，重新壓接新水晶頭後恢復正常。",
                IssueCategory: "線路問題"
            }
        ];

        let editModalObj;
        let chart1Instance = null;
        let chart2Instance = null;

        document.addEventListener('DOMContentLoaded', () => {
            editModalObj = new bootstrap.Modal(document.getElementById('editModal'));
            
            // 監聽登入送出事件
            document.getElementById('loginForm').addEventListener('submit', (e) => {
                e.preventDefault();
                // 切換 View
                document.getElementById('loginView').classList.remove('active');
                document.getElementById('dashboardView').classList.add('active');
                
                // 載入表格與圖表
                renderTable(casesData);
                initCharts();
            });
        });

        function switchTab(tab) {
            document.getElementById('tabAnalytics').classList.remove('active');
            document.getElementById('tabCases').classList.remove('active');
            document.getElementById('analyticsContent').style.display = 'none';
            document.getElementById('casesContent').style.display = 'none';

            const navbarCollapse = document.getElementById('navbarNav');
            if (navbarCollapse.classList.contains('show')) {
                new bootstrap.Collapse(navbarCollapse).hide();
            }

            if (tab === 'analytics') {
                document.getElementById('tabAnalytics').classList.add('active');
                document.getElementById('analyticsContent').style.display = 'block';
            } else {
                document.getElementById('tabCases').classList.add('active');
                document.getElementById('casesContent').style.display = 'block';
            }
        }

        function logout() {
            document.getElementById('dashboardView').classList.remove('active');
            document.getElementById('loginView').classList.add('active');
        }

        function renderTable(data) {
            const tbody = document.getElementById('caseTableBody');
            tbody.innerHTML = '';

            data.forEach(item => {
                const statusBadge = item.CaseClosed 
                    ? `<span class="badge badge-closed">已結案</span>`
                    : `<span class="badge badge-open">未處置</span>`;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="fw-bold small text-nowrap">${item.IssueId}</td>
                    <td class="small text-muted text-nowrap">${item.IssueTime}</td>
                    <td class="text-nowrap">${item.Department}<br><span class="small text-muted">${item.Contact}</span></td>
                    <td class="text-nowrap"><span class="badge bg-secondary">${item.IssueType}</span></td>
                    <td class="small"><div class="text-truncate-custom" title="${item.Description}">${item.Description}</div></td>
                    <td class="text-nowrap">${statusBadge}</td>
                    <td class="text-nowrap"><span class="badge bg-outline-dark border text-dark">${item.IssueCategory}</span></td>
                    <td class="small"><div class="text-truncate-custom" title="${item.ActionTaken || '-'}">${item.ActionTaken || '-'}</div></td>
                    <td class="text-center text-nowrap">
                        <button class="btn btn-sm btn-outline-primary" onclick="openEditModal('${item.IssueId}')">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function openEditModal(issueId) {
            const item = casesData.find(c => c.IssueId === issueId);
            if (!item) return;

            document.getElementById('modalIssueId').value = item.IssueId;
            document.getElementById('displayIssueId').value = item.IssueId;
            document.getElementById('displayDescription').value = item.Description;
            document.getElementById('modalCaseClosed').value = item.CaseClosed ? "true" : "false";
            document.getElementById('modalIssueCategory').value = item.IssueCategory;
            document.getElementById('modalActionTaken').value = item.ActionTaken;

            editModalObj.show();
        }

        function saveCaseAdminData() {
            const issueId = document.getElementById('modalIssueId').value;
            const item = casesData.find(c => c.IssueId === issueId);
            
            if (item) {
                item.CaseClosed = (document.getElementById('modalCaseClosed').value === "true");
                item.IssueCategory = document.getElementById('modalIssueCategory').value;
                item.ActionTaken = document.getElementById('modalActionTaken').value.trim();

                renderTable(casesData);
                updateKPI();
                editModalObj.hide();
            }
        }

        function filterCases() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const statusVal = document.getElementById('statusFilter').value;
            const categoryVal = document.getElementById('categoryFilter').value;

            const filtered = casesData.filter(item => {
                const matchesSearch = item.IssueId.toLowerCase().includes(searchVal) ||
                                      item.Contact.toLowerCase().includes(searchVal) ||
                                      item.Department.toLowerCase().includes(searchVal);
                
                const matchesStatus = (statusVal === "") ||
                                      (statusVal === "Closed" && item.CaseClosed) ||
                                      (statusVal === "Open" && !item.CaseClosed);

                const matchesCategory = (categoryVal === "") || (item.IssueCategory === categoryVal);

                return matchesSearch && matchesStatus && matchesCategory;
            });

            renderTable(filtered);
        }

        function updateKPI() {
            const openCount = casesData.filter(c => !c.CaseClosed).length;
            document.getElementById('kpiOpenCases').innerText = openCount;
        }

        function initCharts() {
            if (chart1Instance) chart1Instance.destroy();
            if (chart2Instance) chart2Instance.destroy();

            const ctx1 = document.getElementById('categoryChart').getContext('2d');
            chart1Instance = new Chart(ctx1, {
                type: 'doughnut',
                data: {
                    labels: ['線路問題', '軟體問題', '硬體問題', '未分類'],
                    datasets: [{
                        data: [45, 25, 20, 10],
                        backgroundColor: ['#1F3A52', '#D4AF37', '#778899', '#E0E0E0']
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: window.innerWidth < 576 ? 'bottom' : 'right' }
                    }
                }
            });

            const ctx2 = document.getElementById('typeChart').getContext('2d');
            chart2Instance = new Chart(ctx2, {
                type: 'bar',
                data: {
                    labels: ['話機障礙', '更改共振組', '其他業務'],
                    datasets: [{
                        label: '報修件數',
                        data: [18, 7, 3],
                        backgroundColor: '#1F3A52'
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } }
                }
            });
        }
    </script>
</body>
</html>
